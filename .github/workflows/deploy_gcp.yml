name: CI/CD Pipeline - Test & Cloud Run Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Verify Production Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Dependencies & Quant Engines
        run: |
          pip install -r requirements.txt
          python -c "import server, quant_engine, forecast_model; print('All core quantitative engines verified!')"

      - name: Build Fullstack Docker Container
        run: |
          docker build -t native-capital:ci-test .

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: test-and-build
    if: ${{ secrets.GCP_SA_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }} -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:latest .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: native-capital
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }}
          region: us-central1
          flags: '--allow-unauthenticated --memory=2Gi --cpu=1 --port=8080'
