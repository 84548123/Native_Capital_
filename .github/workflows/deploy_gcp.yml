name: Deploy Native Capital to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: native-capital
  REGION: us-central1

jobs:
  build-and-deploy:
    name: Build & Deploy Fullstack Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push to Google Artifact Registry
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }} -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:latest .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/native-capital:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated --memory=2Gi --cpu=1 --port=8080'
